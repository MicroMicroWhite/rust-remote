[project]
name = "rust-remote-backend"
version = "0.1.0"
description = "Authenticated remote device control API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "loguru>=0.7,<1",
  "python-multipart>=0.0.20,<1",
]

[dependency-groups]
dev = ["pytest>=8,<9", "httpx>=0.28,<1", "websockets>=14,<16"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
