map $http_upgrade $connection_upgrade { default upgrade; '' close; }
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=agents:10m;

server {
    listen 80;
    server_tokens off;
    client_max_body_size 9m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Only the controller can authorize access to the console's static files.
    location ^~ /_console/ {
        internal;
        alias /usr/share/nginx/html/;
    }
    location ~ "^/[a-f0-9]{8}/api/login$" {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_params_remote;
    }
    location = /agent/ws {
        limit_conn agents 20;
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_params_remote;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }
    location / {
        # The Tunnel hostname is reserved for the agent WebSocket. Keep the
        # controller API and console reachable only through the private LAN.
        if ($host = __TUNNEL_HOSTNAME__) { return 404; }
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_params_remote;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
