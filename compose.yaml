services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        UV_IMAGE: ${UV_IMAGE:-astral/uv:python3.11-bookworm-slim}
        DOCKER_CLI_IMAGE: ${DOCKER_CLI_IMAGE:-docker:28-cli}
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      AGENT_TOKEN: ${AGENT_TOKEN:-}
      ENTRANCE_CODE: ${ENTRANCE_CODE:-}
      HTTP_PORT: ${HTTP_PORT:-8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      RUST_IMAGE: ${RUST_IMAGE:-rust:1.90-slim-bookworm}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      APT_MIRROR: ${APT_MIRROR:-}
      CARGO_MIRROR: ${CARGO_MIRROR:-}
      RUSTUP_MIRROR: ${RUSTUP_MIRROR:-}
    volumes:
      - remote-data:/data
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      # Web builds read the current checkout without rebuilding the backend image.
      - type: bind
        source: ./client
        target: /build-source/client
        read_only: true
        bind:
          create_host_path: false
    group_add:
      - "${DOCKER_GID:-0}"
    restart: unless-stopped
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks: [internal, public]
  frontend:
    build:
      context: ./frontend
      args:
        BUN_IMAGE: ${BUN_IMAGE:-oven/bun:1.3.14-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:alpine}
        TUNNEL_HOSTNAME: ${TUNNEL_HOSTNAME:?TUNNEL_HOSTNAME is required}
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [internal, public]
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TUNNEL_TOKEN:?CLOUDFLARED_TUNNEL_TOKEN is required}
    environment:
      HTTP_PROXY: ${HTTP_PROXY:-http://host.docker.internal:7897}
      HTTPS_PROXY: ${HTTPS_PROXY:-http://host.docker.internal:7897}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1},backend,frontend
      TUNNEL_EDGE_IP_VERSION: "4"
      TUNNEL_TRANSPORT_PROTOCOL: "http2"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [internal, public]
networks:
  internal:
    internal: true
  public:
volumes:
  remote-data:
